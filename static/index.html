<!DOCTYPE html>
<html>
<head>
  <title>DUDO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #fff;
      color: #0a0a0a;
      font-family: 'Futura', 'Century Gothic', 'AppleGothic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 80px;
    }

    h1 {
      font-family: 'Futura', 'Century Gothic', 'AppleGothic', sans-serif;
      font-size: clamp(72px, 18vw, 120px);
      font-weight: 700;
      letter-spacing: 0.1em;
      line-height: 1;
      color: #000;
    }

    .title-rule {
      width: 100%;
      max-width: 440px;
      height: 1px;
      background: #000;
      margin: 6px 0 48px;
    }

    .game {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #555;
      display: block;
      margin-bottom: 8px;
    }

    .panel {
      border: 1px solid #e1e1e1;
      padding: 18px 20px;
    }

    #status {
      font-size: 14px;
      font-weight: 500;
      color: #888;
      min-height: 18px;
    }

    #dice {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #000;
      min-height: 32px;
    }

    #actions {
      font-size: 13px;
      color: #666;
    }

    .bid-fields {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    input[type="number"] {
      background: #fff;
      border: 1px solid #d5d5d5;
      color: #000;
      font-family: 'Futura', 'Century Gothic', 'AppleGothic', sans-serif;
      font-size: 20px;
      font-weight: 700;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    input[type="number"]:focus { border-color: #000; }

    button {
      font-family: 'Futura', 'Century Gothic', 'AppleGothic', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: background 0.12s, color 0.12s, outline-color 0.12s;
    }

    #new-game-btn {
      width: 100%;
      padding: 16px;
      background: #000;
      color: #fff;
      outline: 1px solid transparent;
    }

    #new-game-btn:hover {
      background: #fff;
      color: #000;
      outline-color: #000;
    }

    #bid-btn {
      padding: 10px 20px;
      background: #fff;
      color: #000;
      outline: 1px solid #d5d5d5;
      white-space: nowrap;
    }

    #bid-btn:hover { outline-color: #000; }
  </style>
</head>
<body>

  <h1>DUDO</h1>
  <div class="title-rule"></div>

  <div class="game">

    <button id="new-game-btn" onclick="newGame()">New Game</button>

    <div class="panel">
      <span class="label">Status</span>
      <div id="status">Press New Game to start.</div>
    </div>

    <div class="panel">
      <span class="label">Your Roll</span>
      <div id="dice">—</div>
    </div>

    <div class="panel" id="bid-form">
      <span class="label">Your Bid</span>
      <div class="bid-fields">
        <div class="field">
          <label class="label" for="fv-input">Face Value</label>
          <input type="number" id="fv-input" placeholder="1 – 6" min="1" max="6">
        </div>
        <div class="field">
          <label class="label" for="m-input">Matches</label>
          <input type="number" id="m-input" placeholder="qty">
        </div>
        <button id="bid-btn" onclick="placeBid()">Bid</button>
      </div>
    </div>

    <div id="actions"></div>

  </div>

  <script>
    function newGame() {
      fetch("/new", { method: "POST" })
        .then(r => r.json())
        .then(data => {
          document.getElementById("status").innerHTML =
            `Round ${data.round} &nbsp;·&nbsp; Your dice: ${data.remaining_dices[1]} &nbsp;·&nbsp; CPU dice: ${data.remaining_dices[2]}`
          document.getElementById("dice").innerHTML =
            data.your_dice.join("  ·  ")
        })
    }

    function placeBid() {
      const fv = parseInt(document.getElementById("fv-input").value)
      const m = parseInt(document.getElementById("m-input").value)
      fetch("/bid", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fv: fv, m: m })
      })
        .then(r => r.json())
        .then(data => {
          console.log(data)
        })
    }
  </script>

</body>
</html>
